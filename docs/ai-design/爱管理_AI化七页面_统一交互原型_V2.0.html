<div class="blocks2"><section class="card pad"><div class="spread"><div class="panelhead">项目基本信息</div><span class="pill blue">${mgr()?'项目经理':'普通成员'}</span></div>${[['项目名称','爱管理开发项目'],['项目编号','P-001'],['项目经理','项目经理'],['创建日期','2026-10-22'],['我的角色',mgr()?'项目经理':'开发 / 测试成员'],['项目描述','面向团队的项目管理与多视图协同平台，统一组织需求、计划与任务。']].map(x=>`<div class="info-grid"><span class="label">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</section><section class="card pad"><div class="panelhead">快捷入口</div><div class="quickgrid">${[['需求管理','requirements'],['项目计划','plan'],['任务管理','tasks'],['项目文档','docs'],['成员与角色','members'],['多视图工作台','workbench']].map(([t,k])=>`<button class="quicklink" data-page="${k}">↗ ${t}<small>${k==='workbench'?'多视图关联定位':'查看当前项目内容'}</small></button>`).join('')}</div></section></div><section class="card pad mt16"><div class="spread"><div class="panelhead">${mgr()?'项目最近工作':'我的最近任务'}</div><button class="linkbtn" data-page="tasks">查看任务 →</button></div>${(mgr()?D.tasks:D.tasks.filter(x=>x.assignee==='王五')).slice(0,3).map(t=>`<div class="rowlist"><button class="clicktitle" data-do="focus" data-type="task" data-id="${t.id}">${esc(t.title)}<div class="rowmeta">T-${String(t.id).padStart(3,'0')} · ${t.assignee||'未指派'}</div></button>${pillStatus(t.status)}</div>`).join('')}</section>`}
function requirementRows(){const q=s.reqQuery.trim().toLowerCase();function visible(r){const storycount=D.stories.filter(x=>x.reqIds.includes(r.id)).length;return (!q||`REQ-${r.id} ${r.title}`.toLowerCase().includes(q))&&(s.reqRelation==='all'||(s.reqRelation==='linked'?storycount>0:storycount===0))};const rows=[];function recur(parent,d=0){for(const r of D.requirements.filter(x=>x.parent===parent)){if(visible(r)||!q&&s.reqRelation==='all')rows.push({r,d});if(s.reqExpand[r.id]||q||s.reqRelation!=='all')recur(r.id,d+1)}}recur(null);return rows.map(({r,d})=>{const children=D.requirements.filter(x=>x.parent===r.id).length;const stories=D.stories.filter(x=>x.reqIds.includes(r.id));return `<tr class="${s.highlight?.type==='req'&&s.highlight.id===r.id?'isfocus':''}"><td class="idtag">REQ-${String(r.id).padStart(3,'0')}</td><td><div style="padding-left:${d*21}px" class="flex">${children?`<button class="linkbtn" data-do="toggle-req" data-id="${r.id}">${s.reqExpand[r.id]?'⌄':'›'}</button>`:'<span style="width:22px"></span>'}<button class="clicktitle" data-do="focus" data-type="req" data-id="${r.id}">${esc(r.title)}</button>${children?`<span class="minor">${children}</span>`:''}</div></td><td>${stories.map(x=>`<button class="pill blue" data-do="focus" data-type="story" data-id="${x.id}">US-${String(x.id).padStart(3,'0')}</button>`).join(' ')||'—'}</td><td class="muted">${r.updated}</td><td>${['查看','编辑','子需求'].map((op,i)=>`<button class="linkbtn" data-do="req-op" data-id="${r.id}" data-op="${i}">${op}</button>`).join('')}</td></tr>`}).join('')||`<tr><td colspan="5" class="empty">没有符合条件的需求</td></tr>`}
function requirements(){return `${pageTop('需求管理','',`${mgr()?'<button class="btn ai" data-do="planner-start">✦ AI 智能规划</button>':''}<button class="btn primary" data-do="req-create" ${mgr()?'':'disabled'}>＋ 新建需求</button>`)}<section class="card"><div class="tabbar">${[['list','需求列表',D.requirements.length],['map','故事地图',D.stories.length],['board','故事看板',D.stories.length]].map(([id,title,n])=>`<button class="tab ${s.tab===id?'active':''}" data-do="req-tab" data-id="${id}">${title} <span class="pill ${s.tab===id?'blue':''}">${n}</span></button>`).join('')}</div><div class="tabbody">${s.tab==='list'?`<div class="toolbar"><div class="flex"><input class="field search" placeholder="搜索需求编号或标题" id="reqSearch" value="${esc(s.reqQuery)}"><select class="field short" id="reqRelation"><option value="all" ${s.reqRelation==='all'?'selected':''}>全部关联情况</option><option value="linked" ${s.reqRelation==='linked'?'selected':''}>已关联故事</option><option value="unlinked" ${s.reqRelation==='unlinked'?'selected':''}>未关联故事</option></select></div><button class="btn sm" data-do="refresh">⟳ 刷新</button></div><div class="countbar spread"><span>共 ${D.requirements.length} 条需求</span><span><button class="linkbtn" data-do="req-expand" data-mode="all">全部展开</button><button class="linkbtn" data-do="req-expand" data-mode="none">全部收起</button></span></div><table class="table"><thead><tr><th width="105">ID</th><th>需求标题</th><th width="155">关联用户故事</th><th width="120">更新时间</th><th width="176">操作</th></tr></thead><tbody>${requirementRows()}</tbody></table>`:s.tab==='map'?mapBody(false):boardBody(false)}</div></section>`}
function mapBody(embedded){const goal=D.goals.find(x=>x.id===s.goal)||D.goals[0];const epics=D.epics.filter(x=>x.goalId===goal.id);return `<div class="toolbar" style="border:0"><div><strong class="sm">◈ 产品目标 → Epic → 用户故事</strong><span class="muted tiny">　当前 ${epics.length} 个 Epic · ${D.stories.filter(x=>epics.some(e=>e.id===x.epicId)).length} 条故事</span></div><div class="flex">${!embedded&&mgr()?'<button class="btn sm ai" data-do="scan" data-report="coverage">✦ AI 覆盖检查</button><button class="btn sm" data-do="drawer" data-name="coverage">查看检查报告</button>':''}<button class="btn sm" data-do="story-create" ${mgr()?'':'disabled'}>＋ 产品目标</button><button class="btn sm" data-do="story-create" ${mgr()?'':'disabled'}>＋ Epic</button></div></div><div class="mapgoals">${D.goals.map(g=>`<button class="goal ${s.goal===g.id?'active':''}" data-do="goal" data-id="${g.id}"><strong>◉ ${esc(g.title)}</strong><div class="smallhint">G-${String(g.id).padStart(3,'0')} · ${g.epicIds.length} 个 Epic　→</div></button>`).join('')}</div><div class="notice" style="margin:8px 16px">${esc(goal.title)} 下的故事地图 · 拖拽调整故事归属的正式操作由原仓库提供，本原型仅演示选择与定位</div><div class="epics">${epics.map(e=>{const stories=D.stories.filter(x=>x.epicId===e.id);return `<section class="epic"><div class="epic-title"><div><strong>◈ ${esc(e.title)}</strong> <span class="pill">${stories.length}</span><div class="minor">E-${String(e.id).padStart(3,'0')}</div></div><button class="linkbtn" data-do="story-create" ${mgr()?'':'disabled'}>编辑 Epic</button></div>${stories.map(x=>`<div class="story-card ${s.focus?.type==='story'&&s.focus.id===x.id||s.highlight?.type==='story'&&s.highlight.id===x.id?'focus':''}" data-do="focus" data-type="story" data-id="${x.id}"><div class="storyrow"><span class="idtag">US-${String(x.id).padStart(3,'0')}</span>${x.reqIds.length===0?'<span class="warn-marker">待核查关联</span>':''}</div><div class="strong">${esc(x.title)}</div><small>${esc(x.desc)}</small><div class="spread">${pillStatus(x.status)}<span class="minor">需求 ${x.reqIds.length} · 任务 ${x.taskIds.length}</span></div></div>`).join('')}<button class="btn sm ghost" style="width:100%;margin-top:8px" data-do="story-create" ${mgr()?'':'disabled'}>＋ 新建故事</button></section>`}).join('')}</div>`}
function boardBody(embedded){return `<div class="toolbar"><div class="flex"><input class="field search" placeholder="搜索故事编号或标题" id="boardQuery"><select class="field short" id="boardEpic"><option>全部 Epic</option>${D.epics.map(e=>`<option>${esc(e.title)}</option>`).join('')}</select></div><button class="btn sm" data-do="story-create" ${mgr()?'':'disabled'}>＋ 新建故事</button></div><div class="boardcols">${[['TODO','待处理'],['IN_PROGRESS','进行中'],['DONE','已完成']].map(([k,label])=>`<div class="boardcol"><div class="board-head"><strong>${label}</strong><span class="pill">${D.stories.filter(x=>x.status===k).length}</span></div>${D.stories.filter(x=>x.status===k).map(x=>`<div class="story-card" data-do="focus" data-type="story" data-id="${x.id}"><div class="idtag">US-${String(x.id).padStart(3,'0')}</div><div class="strong">${esc(x.title)}</div><small>${esc(x.desc)}</small><div class="minor">需求 ${x.reqIds.length} · 任务 ${x.taskIds.length}</div></div>`).join('')}</div>`).join('')}</div>`}
function tasks(){const visible=(mgr()?D.tasks:D.tasks.filter(x=>x.assignee==='王五')).filter(t=>(s.taskStatus==='all'||t.status===s.taskStatus)&&(s.taskPriority==='all'||t.priority===s.taskPriority)&&(s.taskMember==='all'||t.assignee===s.taskMember)&&(!s.taskQuery||('T-'+t.id+t.title).toLowerCase().includes(s.taskQuery.toLowerCase())));return `${pageTop('任务管理','',`${mgr()?'<button class="btn sm ai" data-do="drawer" data-name="task">✦ AI 任务建议</button>':''}<button class="btn primary" data-do="task-create" ${mgr()?'':'disabled'}>＋ 新建任务</button>`)}<div class="fourstats">${[['项目任务',mgr()?D.tasks.length:D.tasks.filter(t=>t.assignee==='王五').length],['待处理',visible.filter(x=>x.status==='TODO').length],['进行中',visible.filter(x=>x.status==='IN_PROGRESS').length],['已完成',visible.filter(x=>x.status==='DONE').length]].map(([k,v],i)=>`<div class="card"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('')}</div><section class="card"><div class="tabbar">${[['list','任务列表'],['graph','成员任务图']].map(([k,t])=>`<button class="tab ${s.taskTab===k?'active':''}" data-do="task-tab" data-id="${k}">${t}</button>`).join('')}</div>${s.taskTab==='graph'?graphBody(false):`<div class="toolbar"><div class="flex"><input id="taskSearch" class="field search" value="${esc(s.taskQuery)}" placeholder="搜索任务编号或标题"><select class="field short" id="taskStatus"><option value="all">全部状态</option>${['TODO','IN_PROGRESS','DONE'].map(x=>`<option value="${x}" ${s.taskStatus===x?'selected':''}>${stName(x)}</option>`).join('')}</select><select class="field short" id="taskPriority"><option value="all">全部优先级</option>${[['URGENT','紧急'],['HIGH','高'],['MEDIUM','中']].map(([k,v])=>`<option value="${k}" ${s.taskPriority===k?'selected':''}>${v}</option>`).join('')}</select><select class="field short" id="taskMember"><option value="all">全部负责人</option>${['张三','李四','王五'].map(x=>`<option ${s.taskMember===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="flex"><button class="btn sm" data-do="task-archive">归档管理</button><button class="btn sm" data-do="refresh">⟳ 刷新数据</button></div></div><div class="countbar">任务 · ${visible.length} 项</div><table class="table"><thead><tr><th width="90">ID</th><th>任务标题 / 关联故事</th><th width="105">负责人</th><th width="90">优先级</th><th width="118">完成进度</th><th width="85">状态</th><th width="200">操作</th></tr></thead><tbody>${visible.map(t=>`<tr class="${s.highlight?.type==='task'&&s.highlight.id===t.id?'isfocus':''}"><td class="idtag">T-${String(t.id).padStart(3,'0')}</td><td><button class="clicktitle" data-do="focus" data-type="task" data-id="${t.id}">${esc(t.title)}</button><div class="rowmeta">关联 ${t.storyIds.map(i=>'US-'+String(i).padStart(3,'0')).join('、')||'无'}</div></td><td>${esc(t.assignee||'未指派')}</td><td>${t.priority==='URGENT'?'<span class="red">● 紧急</span>':t.priority==='HIGH'?'<span class="orange">● 高</span>':'● 中'}</td><td><div class="flex"><div style="height:5px;width:65px;background:#e6edf5;border-radius:4px"><div style="width:${t.progress}%;height:100%;background:${t.status==='DONE'?'#21a16e':'#5c9ef5'}"></div></div><span class="tiny muted">${t.progress}%</span></div></td><td>${pillStatus(t.status)}</td><td><button class="linkbtn" data-do="focus" data-type="task" data-id="${t.id}">查看</button><button class="linkbtn" data-do="task-edit" data-id="${t.id}" ${mgr()?'':'disabled'}>编辑</button><button class="linkbtn" data-do="task-ai" data-id="${t.id}">✦ AI建议</button></td></tr>`).join('')}</tbody></table>`}</section>`}
function graphBody(embedded){const members=[...new Set((mgr()?D.tasks:D.tasks.filter(x=>x.assignee==='王五')).map(x=>x.assignee||'未分配'))];return `<div style="padding:14px"><div class="toolbar" style="padding:0 0 14px"><div class="muted tiny">成员 → 任务关系　·　点击任务卡片定位详情</div><span class="muted tiny">任务与计划关联数据共享</span></div>${members.map(m=>{const t=(mgr()?D.tasks:D.tasks.filter(x=>x.assignee==='王五')).filter(x=>(x.assignee||'未分配')===m);return `<div class="networkrow"><div class="netmember"><strong>${m}</strong><div class="tiny muted">${t.length} 项任务</div></div><span style="color:#97b6e6;font-size:20px">━━</span><div class="nettasks">${t.map(x=>`<button class="nettask" data-do="focus" data-type="task" data-id="${x.id}"><b class="idtag">T-${String(x.id).padStart(3,'0')}</b> · ${esc(x.title)}<div class="tiny muted">${stName(x.status)} · ${x.progress}%</div></button>`).join('')}</div></div>`}).join('')}</div>`}
function timelineDate(d){return (new Date(d+'T00:00:00')-new Date('2026-10-10T00:00:00'))/86400000;}
function ganttBody(embedded=false){const st=stage(), items=D.plans.filter(i=>i.stageId===st.id);const rows=[{id:st.id,title:st.title,start:st.start,end:st.end,kind:'stage',owner:st.owner},...items];const bar=r=>{let left=Math.max(2,timelineDate(r.start)*17);let w=r.kind==='milestone'?13:Math.max(28,(timelineDate(r.end)-timelineDate(r.start)+1)*17);return r.kind==='milestone'?`<div class="milestone" style="left:${left}px" title="${esc(r.title)}"></div>`:`<div class="gantt-bar ${r.kind==='stage'?'stage':r.status==='DONE'?'done':''} ${s.highlight?.type==='plan'&&s.highlight.id===r.id?'isfocus':''}" style="left:${left}px;width:${w}px">${esc(r.title)}</div>`};return `<div class="work-card" style="margin-top:${embedded?0:13}px"><div class="spread pad" style="border-bottom:1px solid var(--line)"><div><strong>阶段甘特图</strong> <span class="muted tiny">${items.filter(x=>x.kind==='item').length} 项计划 · ${items.filter(x=>x.kind==='milestone').length} 个里程碑</span></div><div class="flex">${!embedded&&mgr()?'<button class="btn sm ai" data-do="drawer" data-name="plan">✦ AI 风险与推演</button>':''}<button class="btn sm" data-do="gantt-today">今天</button><button class="btn sm" data-do="gantt-scale">周 ⌄</button><button class="btn sm" data-do="plan-create" ${mgr()?'':'disabled'}>＋ 新建计划项</button></div></div><div class="muted tiny pad" style="padding:9px 14px;border-bottom:1px solid var(--line)"><span class="pill blue">阶段计划</span>　<span class="pill">进行中</span>　<span class="pill green">已完成</span>　<span class="pill orange">◆ 里程碑</span></div><div class="gantt-scroller"><div class="gantt-grid"><div class="gantt-head"><span>计划 / 工作项</span><span>负责人</span><span>预计开始</span><span>预计结束</span><span>10/10　　10/17　　10/24　　10/31　　11/07</span></div>${rows.map(r=>`<div class="gantt-line"><button class="clicktitle" style="padding-left:${r.kind==='stage'?12:22}px" data-do="focus" data-type="plan" data-id="${r.id}">${r.kind==='milestone'?'◆':r.kind==='stage'?'▣':'▤'} ${esc(r.title)}</button><span>${esc(r.owner)}</span><span>${r.start.slice(5)}</span><span>${r.end.slice(5)}</span><div class="gantt-track">${bar(r)}</div></div>`).join('')}</div></div><div class="smallhint pad" style="padding:10px 16px">本原型保持原甘特图字段与工作项结构；拖拽保存由正式 SPM 组件负责。AI 推演不自动修改正式日期。</div></div>`}
function planOverview(){const st=stage();const items=D.plans.filter(x=>x.stageId===st.id);return `<div class="fourstats">${[['阶段计划项',items.filter(x=>x.kind==='item').length],['关联任务',new Set(items.flatMap(x=>x.tasks)).size],['阶段里程碑',items.filter(x=>x.kind==='milestone').length],['覆盖负责人',new Set(items.map(x=>x.owner)).size]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('')}</div><div class="card pad"><div class="panelhead">关键时间</div><div class="spread"><span>◉ 开始时间 <b>${st.start}</b></span><span>◉ 阶段里程碑 <b>2026-10-31</b></span><span>◉ 结束时间 <b>${st.end}</b></span></div></div><div class="blocks2 mt16"><section class="card pad"><div class="panelhead">基本信息</div><div class="kv"><span>阶段</span><b>${st.title}</b></div><div class="kv"><span>负责人</span><span>${st.owner}</span></div><div class="kv"><span>起止日期</span><span>${st.start} — ${st.end}</span></div></section><section class="card pad"><div class="panelhead">计划目标</div>${['完成需求整理','确认 UI/UX 页面规范','完成用例图设计'].map(t=>`<div class="rowlist"><label><input type="checkbox"> ${t}</label></div>`).join('')}</section></div><div class="card pad mt16"><div class="spread"><div class="panelhead">阶段工作项</div><button class="linkbtn" data-do="plan-tab" data-id="list">查看完整列表 →</button></div>${items.slice(0,4).map(x=>`<div class="rowlist"><button class="clicktitle" data-do="focus" data-type="plan" data-id="${x.id}">${x.title}</button><span class="muted">${x.owner}　${x.start} 起</span></div>`).join('')}</div>`}
function planList(){const items=D.plans.filter(x=>x.stageId===s.stage);return `<div class="work-card"><div class="toolbar"><div><button class="btn sm primary" data-do="plan-create" ${mgr()?'':'disabled'}>＋ 创建计划项</button><span class="muted tiny">　计划项 ${items.filter(x=>x.kind==='item').length}　里程碑 ${items.filter(x=>x.kind==='milestone').length}</span></div><div class="flex"><button class="btn sm" data-do="drawer" data-name="plan">✦ AI 计划检查</button><button class="btn sm" data-do="plan-create">＋ 里程碑</button></div></div><div class="countbar">计划工作项 · 列表模式</div><table class="table"><thead><tr><th>标题</th><th>负责人</th><th>优先级</th><th>预计开始</th><th>预计结束</th><th>状态</th><th>关联任务</th></tr></thead><tbody>${items.map(p=>`<tr><td><button class="clicktitle" data-do="focus" data-type="plan" data-id="${p.id}">${p.kind==='milestone'?'◆':'▤'} ${esc(p.title)}</button></td><td>${p.owner}</td><td>${p.kind==='milestone'?'—':p.priority==='HIGH'?'高':'中'}</td><td>${p.start}</td><td>${p.end}</td><td>${p.kind==='milestone'?'<span class="pill orange">里程碑</span>':pillStatus(p.status)}</td><td>${p.tasks.map(i=>`<button class="linkbtn" data-do="focus" data-type="task" data-id="${i}">T-${String(i).padStart(3,'0')}</button>`).join(' ')||'—'}</td></tr>`).join('')}</tbody></table></div>`}
function planKanban(){const items=D.plans.filter(x=>x.stageId===s.stage&&x.kind==='item');return `<section class="work-card"><div class="pad strong">阶段工作项看板 <span class="muted tiny">按计划项状态分组，不自动改写任务状态</span></div><div class="boardcols" style="grid-template-columns:repeat(4,1fr)">${[['TODO','待处理'],['IN_PROGRESS','进行中'],['DONE','已完成'],['PAUSED','暂缓']].map(([k,l])=>`<div class="boardcol"><div class="board-head"><b>${l}</b><span class="pill">${items.filter(x=>x.status===k).length}</span></div>${items.filter(x=>x.status===k).map(x=>`<div class="story-card" data-do="focus" data-type="plan" data-id="${x.id}"><strong>${x.title}</strong><small>${x.start} — ${x.end}</small><div>${x.owner}</div></div>`).join('')}</div>`).join('')}</div></section>`}
function memberBody(embedded=false){const entries=D.plans.filter(p=>p.stageId===s.stage&&p.kind==='item').flatMap(p=>p.tasks.map(id=>({p,t:task(id)}))).filter(x=>x.t).filter(x=>mgr()||x.t.assignee==='王五');const members=[...new Set(entries.map(x=>x.t.assignee||'未指派'))];const uniqueTasks=new Set(entries.map(x=>x.t.id)).size;const inProgress=new Set(entries.filter(x=>x.p.status==='IN_PROGRESS').map(x=>x.p.id)).size;return `<div class="work-card" style="margin-top:${embedded?0:13}px"><div class="toolbar"><div><strong>成员任务跟踪</strong> <span class="muted tiny">按负责人展开与追踪计划关联任务</span></div><div class="flex">${!embedded&&mgr()?'<button class="btn sm ai" data-do="drawer" data-name="member">✦ AI 负载与瓶颈</button>':''}<input class="field short" placeholder="搜索关联任务" id="memberSearch"><select class="field short" id="memberSelect"><option>全部负责人</option>${members.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn sm" data-do="refresh">重置</button></div></div><div class="member-summary"><div><b>${members.length}</b><span>相关成员</span></div><div><b>${uniqueTasks}</b><span>关联任务</span></div><div><b>${inProgress}</b><span>进行中的计划项</span></div><span class="muted tiny" style="margin-left:auto">仅显示当前阶段及授权可见的任务</span></div><div class="spread pad"><label class="tiny"><input type="checkbox" id="memberOnly" ${s.onlyLinked?'checked':''}> 仅显示已关联任务</label><div><button class="linkbtn" data-do="member-expand" data-id="all">全部展开</button><button class="linkbtn" data-do="member-expand" data-id="none">全部收起</button> <span class="muted tiny">共 ${entries.length} 条计划关联记录</span></div></div><div class="memberrow head"><span>成员 / 任务标题</span><span>关联任务 ID</span><span>优先级</span><span>预计开始</span><span>预计结束</span><span>计划项状态</span></div>${members.map(m=>{const rows=entries.filter(x=>(x.t.assignee||'未指派')===m);return `<div class="memberline"><button class="linkbtn" data-do="member-toggle" data-id="${m}">${s.groups[m]===false?'▸':'▾'}</button><span class="avatar" style="height:24px;width:24px;font-size:11px">${m.slice(0,1)}</span><b>${m}</b><span class="pill blue">${new Set(rows.map(x=>x.t.id)).size} 个任务</span><span class="muted tiny">计划项 ${rows.length} 条</span>${m==='李四'?'<span class="pill orange">AI 待核查</span>':''}</div>${s.groups[m]===false?'':rows.map(({p,t})=>`<div class="memberrow ${s.highlight?.type==='task'&&s.highlight.id===t.id?'isfocus':''}"><div><button class="clicktitle" data-do="focus" data-type="task" data-id="${t.id}">▤ ${esc(t.title)}</button><div class="rowmeta"><button class="linkbtn" data-do="focus" data-type="plan" data-id="${p.id}">关联计划项：${esc(p.title)}</button></div></div><span class="idtag">T-${String(t.id).padStart(3,'0')}</span><span>${p.priority==='HIGH'?'高':'中'}</span><span>${p.start}</span><span>${p.end}</span><span>${pillStatus(p.status)}</span></div>`).join('')}`}).join('')}<div class="pad tiny muted">按真实任务负责人分组，任务本体仍由任务管理维护；不根据关联数量自动计算工时利用率。</div></div>`}
function planPage(){const st=stage();return `<div class="breadcrumb" style="margin-left:18px">我的项目　›　爱管理开发项目　›　项目计划</div><div class="planwrap"><aside class="stageside"><button class="btn ghost sm" style="width:100%;justify-content:start" data-do="plan-create" ${mgr()?'':'disabled'}>＋ 新建阶段计划</button><input class="field mt12" placeholder="搜索阶段计划" id="stageSearch"><div class="mt16 muted tiny">阶段计划（${D.stages.length}）</div>${D.stages.map(a=>`<button class="stagecard ${s.stage===a.id?'active':''}" data-do="stage" data-id="${a.id}"><strong>⚑ ${a.title}</strong><small>${a.start} — ${a.end}</small><div class="tiny muted">完成 ${a.progress}%　计划项 ${D.plans.filter(p=>p.stageId===a.id&&p.kind==='item').length} · 里程碑 ${D.plans.filter(p=>p.stageId===a.id&&p.kind==='milestone').length}</div><div class="stageprogress"><i style="width:${a.progress}%"></i></div></button>`).join('')}</aside><div class="stagebody"><div class="stageheading"><div><h2>⚑ ${esc(st.title)}</h2><div class="muted tiny mt8">${st.start} — ${st.end}　负责人：${st.owner}</div></div><div class="flex"><button class="btn sm" data-do="plan-create" ${mgr()?'':'disabled'}>详情</button><button class="btn sm" data-do="plan-create" ${mgr()?'':'disabled'}>编辑阶段</button><button class="btn sm primary" data-do="plan-create" ${mgr()?'':'disabled'}>＋ 添加计划项</button></div></div><div class="stagetabs">${[['overview','概览'],['list','列表'],['kanban','看板'],['gantt','甘特图'],['members','成员任务跟踪']].map(([k,v])=>`<button class="${s.planTab===k?'active':''}" data-do="plan-tab" data-id="${k}">${v}</button>`).join('')}</div><div>${s.planTab==='overview'?planOverview():s.planTab==='list'?planList():s.planTab==='kanban'?planKanban():s.planTab==='gantt'?ganttBody():memberBody()}</div></div></div>`}
function wbRelations(f){if(!f)return {stories:[],tasks:[],plans:[],uml:[],reqs:[]};let stories=[],tasks=[],plans=[],uml=[],reqs=[];let o=f.type==='req'?req(f.id):f.type==='story'?story(f.id):f.type==='task'?task(f.id):f.type==='plan'?plan(f.id):D.uml.find(x=>x.id===f.id);if(!o)return {stories,tasks,plans,uml,reqs};if(f.type==='story')stories=[o.id];if(f.type==='task'){tasks=[o.id];stories=o.storyIds}if(f.type==='req')reqs=[o.id];if(f.type==='plan'){plans=[o.id];tasks=o.tasks||[]}if(f.type==='uml'){uml=[o.id];stories=o.storyIds||[]}
for(let i=0;i<4;i++){for(const st of D.stories)if(stories.includes(st.id)||st.reqIds.some(id=>reqs.includes(id))||st.taskIds.some(id=>tasks.includes(id)))stories.push(st.id);stories=[...new Set(stories)];for(const st of D.stories.filter(x=>stories.includes(x.id))){tasks.push(...st.taskIds);reqs.push(...st.reqIds)}tasks=[...new Set(tasks)];reqs=[...new Set(reqs)];for(const p of D.plans)if(p.tasks.some(id=>tasks.includes(id)))plans.push(p.id);plans=[...new Set(plans)];for(const x of D.uml)if(x.storyIds.some(id=>stories.includes(id)))uml.push(x.id);uml=[...new Set(uml)]}return {stories,tasks,plans,uml,reqs}}
const viewNames={map:'故事地图',board:'故事看板',gantt:'甘特图',members:'成员任务图',uml:'UML 用例图'};
function wbFocus(){if(!s.focus)return `<strong>◎ 当前关联焦点　<span class="pill">未选中</span></strong><div class="muted tiny mt8">点击任一视图中的故事、任务、计划项或 UML 用例 · 切换视图时焦点保留</div>`;const f=s.focus;const v=f.type==='story'?story(f.id)?.title:f.type==='task'?task(f.id)?.title:f.type==='plan'?plan(f.id)?.title:f.type==='req'?req(f.id)?.title:D.uml.find(x=>x.id===f.id)?.title;const rel=wbRelations(f);return `<div class="spread"><strong>◎ 当前关联焦点　<span class="pill blue">${esc(f.type)} · ${esc(f.id)}</span></strong><button class="btn sm" data-do="clear-focus">清除焦点</button></div><div class="strong mt8">${esc(v||'未知对象')}</div><div class="muted tiny mt8">关联需求 ${rel.reqs.length} · 故事 ${rel.stories.length} · 任务 ${rel.tasks.length} · 计划项 ${rel.plans.length} · UML 用例 ${rel.uml.length}　| 通过已有关系数据高亮，不表示存在任务依赖</div>`}
function wbPane(view,side){let html='';const old=s.planTab;switch(view){case 'map':html=mapBody(true);break;case 'board':html=boardBody(true);break;case 'gantt':html=ganttBody(true);break;case 'members':html=graphBody(true);break;case 'uml':html=`<div class="umlbox"><div class="actor">♙<div class="tiny">项目经理 / 成员</div></div><div class="usecases">${D.uml.map(u=>`<button class="usecase ${s.focus?.type==='uml'&&s.focus.id===u.id?'isfocus':''}" data-do="focus" data-type="uml" data-id="${u.id}">${esc(u.title)}</button>`).join('')}</div></div>`;break;}return `<section class="wbpane"><div class="wphead">◈ ${viewNames[view]} <span class="tiny muted">${side}</span></div><div class="wbinner">${html}</div></section>`}
function workbench(){return `${pageTop('多视图工作台','五种视图统一查看与关联定位',`${mgr()?'<button class="btn sm ai" data-do="drawer" data-name="workbench">✦ AI 跨视图分析</button>':''}<button class="btn sm" data-do="refresh">⟳ 刷新视图</button>`)}<section class="card workbench"><div class="tabbar">${Object.entries(viewNames).map(([k,v])=>`<button class="tab ${s.wb===k?'active':''}" data-do="wb-primary" data-id="${k}">${v}</button>`).join('')}</div><div class="workbar"><div class="flex"><button class="btn sm ${!s.dual?'primary':''}" data-do="wb-dual" data-id="no">单视图</button><button class="btn sm ${s.dual?'primary':''}" data-do="wb-dual" data-id="yes">双视图联动</button>${s.dual?`<span class="muted tiny">右侧视图</span><select class="field short" id="wbSecond">${Object.entries(viewNames).filter(([k])=>k!==s.wb).map(([k,v])=>`<option value="${k}" ${s.wbOther===k?'selected':''}>${v}</option>`).join('')}</select>`:''}</div><div class="mini-actions"><span class="muted tiny">${s.dual?'左右双向定位已启用':'单视图浏览'}</span>${[['map','board','地图 + 看板'],['gantt','members','甘特 + 成员'],['map','uml','地图 + UML']].map(([a,b,l])=>`<button class="btn sm" data-do="wb-preset" data-a="${a}" data-b="${b}">${l}</button>`).join('')}</div></div><div class="toolbar" style="justify-content:start"><span class="muted tiny">需求与故事 ${D.requirements.length}/${D.stories.length}　未归档任务 ${D.tasks.length}　关联计划项 ${D.plans.length}　UML 用例 ${D.uml.length}</span><select class="field mid" id="focusStory"><option value="">按故事快速定位</option>${D.stories.map(st=>`<option value="${st.id}" ${s.focus?.type==='story'&&s.focus.id===st.id?'selected':''}>US-${String(st.id).padStart(3,'0')} · ${esc(st.title)}</option>`).join('')}</select></div><div class="focusbar">${wbFocus()}</div><div class="wbpanes ${s.dual?'dual':''}">${wbPane(s.wb,'左侧视图')}${s.dual?wbPane(s.wbOther,'右侧视图'):''}</div></section>`}
function plannerSource(){return s.planner.mode==='existing'?req(s.planner.sourceId):null}
function plannerNewItems(){return [{id:'r0',kind:'req',parent:null,title:'任务管理与协作',description:'支持任务创建、负责人分配和个人任务跟踪。',ac:'能够使用既有项目角色权限校验。',status:'create',reviewed:false},{id:'r1',kind:'req',parent:'r0',title:'任务分配',description:'项目经理可以为任务指定并调整负责人。',ac:'负责人必须属于当前项目。',status:'create',reviewed:false},{id:'r2',kind:'req',parent:'r1',title:'为任务指定负责人',description:'编辑任务时可选择项目成员。',ac:'仅可选授权成员。',status:'reuse',matchId:5,reviewed:false},{id:'r3',kind:'req',parent:'r0',title:'我的任务查看',description:'成员能够查看本人任务。',ac:'不能查看无权限项目任务。',status:'create',reviewed:false},{id:'e1',kind:'epic',parent:null,title:'任务协作与分配',description:'建议复用 Epic：任务与协作',status:'reuse',matchId:2,reviewed:false},{id:'u1',kind:'story',title:'作为项目经理，我希望为任务指定负责人',description:'以便明确任务执行责任。',ac:'候选负责人仅限当前项目成员。',reqRef:'r2',epicRef:'e1',status:'reuse',matchId:3,reviewed:false},{id:'u2',kind:'story',title:'作为项目成员，我希望查看本人任务',description:'以便安排个人工作。',ac:'只返回本人授权任务。',reqRef:'r3',epicRef:'e1',status:'create',reviewed:false},{id:'t1',kind:'task',title:'开发负责人选择组件',description:'对接项目成员列表与任务编辑表单。',storyRef:'u1',status:'create',reviewed:false},{id:'t2',kind:'task',title:'验证任务分配权限',description:'编写越权访问与成员校验测试。',storyRef:'u1',status:'create',reviewed:false}];}

function plannerHeader(){return `<div class="spread"><div><div class="breadcrumb">我的项目　›　爱管理开发项目　›　需求管理　›　AI 智能需求规划</div><h1 class="pagetitle">✦ AI 智能需求规划</h1></div><div class="flex"><button class="btn sm" data-do="planner-back">返回需求管理</button><button class="btn sm" data-do="planner-drafts">我的草稿</button></div></div><div class="wizardstep"><span>① 输入需求</span><span>→ ② AI 分析</span><span>→ ③ 人工审核</span><span>→ ④ 确认写入</span></div>`}
function planning(){const p=s.planner;let body='';if(p.step==='input'){body=`<div class="blocks2"><section class="card pad"><h3>输入需求</h3><div class="notice">${p.mode==='existing'?'已自动带入当前需求的授权可见内容；原内容不会自动覆盖。':'输入自然语言需求，可补充项目背景与约束。'}</div><label class="formlabel">需求描述 / 分析要求</label><textarea class="field" style="min-height:150px" id="plannerInput" placeholder="例如：项目经理可以创建任务、分配负责人，成员查看我的任务。">${esc(p.input)}</textarea><label class="formlabel">补充背景与约束</label><textarea class="field" id="plannerNotes" placeholder="例如：保留已有权限，优先复用已有需求。">${esc(p.notes)}</textarea><div class="flex mt16"><button class="btn sm" data-do="planner-sample">填入示例</button><button class="btn primary" data-do="planner-generate">✦ 开始 AI 分析</button></div></section><section class="card pad"><h3>分析范围</h3><div class="notice">AI 将建议正式需求、1–3 层子需求、验收条件、候选故事、候选 Epic、实施任务和关联关系。所有建议经人工审核后才能写入。</div><div class="rowlist">✔ 需求层级与验收条件</div><div class="rowlist">✔ 疑似重复对象与复用建议</div><div class="rowlist">✔ Epic / 故事地图归属</div><div class="rowlist">✔ 候选任务可不指定负责人</div><div class="rowlist">✔ 事务校验和提交演示</div><button class="btn sm mt16" data-do="planner-drafts">继续草稿 →</button></section></div>`}else if(p.step==='loading'){body=`<section class="card pad"><h2>正在分析需求…</h2><div class="notice">原型模拟：读取项目授权数据 → 规则校验 → 生成候选内容 → 等待人工审核。</div><button class="btn" data-do="planner-retry">返回输入</button></section>`}else if(p.step==='failed'){body=`<section class="card pad"><h2>AI 分析失败</h2><div class="notice err">模拟模型服务不可用。已保留输入信息和已保存草稿；可手动重试。</div><button class="btn ai" data-do="planner-retry">重新尝试</button></section>`}else if(p.step==='review'){const n=p.items.find(x=>x.id===p.selected)||p.items[0];const typeNames={req:'正式需求',epic:'候选 Epic',story:'用户故事',task:'实施任务'};body=`<div class="spread mt8 mb12"><div><b>AI 规划结果</b> <span class="muted tiny">逐项选择、修改、复用或跳过</span></div><div class="flex"><span class="pill blue">已审核 ${p.items.filter(x=>x.reviewed).length} / ${p.items.length}</span><button class="btn sm" data-do="planner-save">保存草稿</button><button class="btn sm primary" data-do="planner-confirm">校验并确认</button></div></div><div class="wizard-body"><div class="wizard-tree">${['req','epic','story','task'].map(k=>`<div class="strong mt12">${typeNames[k]} <span class="pill">${p.items.filter(x=>x.kind===k).length}</span></div>${p.items.filter(x=>x.kind===k).map(x=>`<button class="nodebtn ${p.selected===x.id?'active':''}" data-do="planner-select" data-id="${x.id}"><span class="pill ${x.status==='skip'?'':'blue'}">${x.status==='skip'?'跳过':x.status==='reuse'?'复用':'新建'}</span><span style="flex:1">${esc(x.title)}</span>${x.reviewed?'✓':''}</button>`).join('')}`).join('')}</div><div class="wizard-editor"><div class="spread"><h3 style="margin:0">${typeNames[n.kind]} · 审核详情</h3><span class="pill ${n.matchId?'orange':'blue'}">${n.matchId?'疑似重复 / 可复用':'AI 候选'}</span></div>${n.matchId?`<div class="notice warn">检测到疑似重复对象：${n.kind==='req'?'REQ':n.kind==='story'?'US':'Epic'}-${n.matchId}。文本相似不代表一定重复，请人工决定。</div>`:''}<label class="formlabel">处理方式</label><select class="field" id="plannerAction" data-id="${n.id}"><option value="create" ${n.status==='create'?'selected':''}>创建新对象</option>${n.matchId?`<option value="reuse" ${n.status==='reuse'?'selected':''}>复用已有对象并建立关联</option>`:''}<option value="skip" ${n.status==='skip'?'selected':''}>跳过此项</option></select><label class="formlabel">标题</label><input class="field" id="plannerTitle" value="${esc(n.title)}"><label class="formlabel">描述</label><textarea class="field" id="plannerDesc">${esc(n.description||'')}</textarea>${n.kind==='req'||n.kind==='story'?`<label class="formlabel">验收条件</label><textarea class="field" id="plannerAc">${esc(n.ac||'')}</textarea>`:''}${n.kind==='req'?`<label class="formlabel">父需求（最多 3 级）</label><select class="field" id="plannerParent"><option value="">顶层需求</option>${p.items.filter(x=>x.kind==='req'&&x.id!==n.id).map(x=>`<option value="${x.id}" ${x.id===n.parent?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`:''}<div class="notice">${n.kind==='story'?'用户故事与正式需求独立存储，通过关联表连接。':n.kind==='task'?'实施任务初始为待处理，负责人可留空；不会自动修改甘特计划。':n.kind==='epic'?'优先复用已有产品目标和 Epic；新增需单独审核。':'父子需求与关联关系在提交前校验。'}</div><button class="btn primary" data-do="planner-review" data-id="${n.id}">✓ 标记已审核</button></div></div>`}else if(p.step==='confirm'){let items=p.items.filter(x=>x.status!=='skip');const problems=plannerValidation();body=`<section class="card pad"><h3>确认创建 · 统一校验</h3><div class="notice ${problems.length?'warn':'good'}">${problems.length?'校验未通过，请返回审核：'+problems.map(esc).join('；'):'已通过模拟关联与权限校验。以下对象仅写入原型内存，不会修改真实 SPM 数据库。'}</div><div class="fourstats">${['req','epic','story','task'].map(k=>`<div class="card pad"><div class="muted">${{req:'正式需求',epic:'Epic',story:'用户故事',task:'实施任务'}[k]}</div><strong style="font-size:24px">${items.filter(x=>x.kind===k&&x.status==='create').length}</strong></div>`).join('')}</div><p class="muted">复用已有对象 ${items.filter(x=>x.status==='reuse').length} 项；跳过 ${p.items.filter(x=>x.status==='skip').length} 项。正式系统需通过 PostgreSQL / Prisma 单事务提交。</p><div class="flex"><button class="btn" data-do="planner-step-review">返回审核</button><button class="btn primary" data-do="planner-commit" ${problems.length?'disabled':''}>确认所选内容（模拟事务）</button><button class="btn" data-do="planner-save">保存草稿</button></div></section>`}else if(p.step==='success'){body=`<section class="card pad" style="text-align:center"><div style="font-size:42px;color:#1e9a69">✓</div><h2>提交演示成功</h2><p class="muted">候选对象已加入本原型内存数据，可在需求管理、故事地图与任务管理中查看；刷新页面后恢复演示基线。</p><div class="flex" style="justify-content:center"><button class="btn primary" data-page="requirements">查看需求管理</button><button class="btn" data-do="show-story-map">查看故事地图</button><button class="btn" data-page="tasks">查看任务管理</button></div></section>`}return `<div>${plannerHeader()}${body}</div>`}
function openDrawer(name,params={}){s.drawer=name;s.dt=params.tab||'';s.riskOpen='';s.riskLevel='all';s.drawerTask=params.task||null;$('scrim').classList.add('open');$('drawer').classList.add('open');drawer()}
function closeDrawer(){s.drawer='';$('scrim').classList.remove('open');$('drawer').classList.remove('open')}
function tabsFor(n){return n==='health'?['进度风险','计划风险','任务分配','人员负载','历史报告']:n==='coverage'?['问题清单','关联建议','候选故事','历史报告']:n==='task'?['执行建议','任务拆分','历史报告']:n==='plan'?['计划风险','方案推演','历史报告']:n==='member'?['工作集中度','瓶颈证据','处理建议']:n==='workbench'?['风险清单','关联证据','处理建议']:[]}
const rtitles={health:'AI 项目健康诊断',coverage:'AI 故事关联与覆盖检查',task:'AI 任务拆分与执行建议',plan:'AI 进度风险与调整方案推演',member:'AI 工作集中度与瓶颈分析',workbench:'AI 跨视图关联与定位'};
function showRisks(n,filterDim=null){const rep=aiReport(n);const available=rep?.items||[];if(!rep||['loading','failed','empty'].includes(rep.status))return `<div class="notice ${rep?.status==='failed'?'err':''}">${rep?.status==='loading'?'分析中…':rep?.status==='failed'?'模型分析失败，保留已有输入。可手动重试。':'目前没有已保存报告。请主动点击「开始分析」后查看结果。'}</div><button class="btn primary" data-do="scan" data-report="${n}" ${!mgr()?'disabled':''}>✦ ${rep?'重新分析':'开始分析'}</button>`;if(rep.status==='clear')return `<div class="notice good">本次演示规则检查未发现风险。并不代表项目未来没有任何风险。</div>`;let items=allowList(available).filter(x=>!filterDim||x.dim===filterDim).filter(x=>s.riskLevel==='all'||x.level===s.riskLevel);return `<div class="spread mb12"><span class="muted tiny">${items.length} 条待核查分析记录　·　${esc(rep.at)}</span><select id="riskLevel" class="field short"><option value="all">全部等级</option><option value="high" ${s.riskLevel==='high'?'selected':''}>高风险</option><option value="mid" ${s.riskLevel==='mid'?'selected':''}>中风险</option><option value="low" ${s.riskLevel==='low'?'selected':''}>低风险</option></select></div>${rep.status==='partial'?'<div class="notice warn">部分 AI 解释生成失败；已保留可核验的规则检查结果。</div>':''}${items.map(i=>riskCard(i)).join('')||'<div class="empty">当前筛选下无风险记录</div>'}`}
function riskCard(i){const open=s.riskOpen===i.id;return `<article class="risk"><button class="riskhead" data-do="risk-open" data-id="${i.id}"><div><span class="tiny muted">${esc(i.id.toUpperCase())} · ${esc(i.entity||'关联对象')}</span><div class="strong mt8">${esc(i.title)}</div></div><div class="flex">${levPill(i.level)}<span>${open?'⌃':'⌄'}</span></div></button>${open?`<div class="riskbody"><strong class="sm">已确认的事实证据</strong><div class="evidence">${esc(i.fact)}</div><strong class="sm">AI 推断（待核查）</strong><p class="muted sm">${esc(i.ai)}</p><strong class="sm">处理建议</strong><div class="advice">${esc(i.advice)}</div><div class="spread"><button class="btn sm" data-do="focus" data-type="${i.e.type}" data-id="${i.e.id}">定位业务对象 →</button><span class="muted tiny">所有修改需人工授权确认</span></div></div>`:''}</article>`}
function healthDrawer(){const rep=aiReport('health');const tab=s.dt||'进度风险';return `<div class="notice">四维风险由事实证据与 AI 建议组成。相同底层问题可跨维度展示，摘要总数按事实去重；没有任务截止日期时不得计算任务超期。</div>${tab==='历史报告'?historyContent('health'):showRisks('health',tab)}`}
function historyContent(n){const a=(s.ai[n]?.history||[]).slice().reverse();return `<div class="spread mb12"><strong>历史诊断记录</strong><span class="muted tiny">本地演示记录 · 可恢复查看</span></div>${a.length?a.map((rep,i)=>`<div class="reportrow"><div><strong>报告 ${a.length-i}</strong><div class="muted tiny">${esc(rep.at)} · ${esc(rep.status)} · ${rep.items?.length||0} 条</div></div><button class="btn sm" data-do="history" data-name="${n}" data-index="${a.length-i-1}">查看报告</button></div>`).join(''):'<div class="empty">暂无历史记录。执行两次诊断即可验证历史切换。</div>'}${s.historyId?`<div class="notice">正在查看历史报告：${esc(s.historyId.at||'')}（只读）</div>${(s.historyId.items||[]).map(x=>`<div class="risk pad"><strong>${esc(x.title)}</strong><div class="evidence">${esc(x.fact)}</div><div class="advice">${esc(x.advice)}</div></div>`).join('')}<button class="btn sm" data-do="history-latest">返回最新报告</button>`:''}`}
function coverageDrawer(){const tab=s.dt||'问题清单';if(tab==='历史报告')return historyContent('coverage');if(tab==='问题清单')return `<div class="spread"><strong>故事覆盖检查</strong><span class="pill">演示结果</span></div>${showRisks('coverage')}`;if(tab==='关联建议')return `<div class="notice">以下建议依据项目业务关系生成，不会自动修改正式需求或故事。</div>${R.coverage.map(x=>`<div class="risk pad"><strong>${esc(x.title)}</strong><div class="evidence">${esc(x.fact)}</div><div class="advice">${esc(x.advice)}</div><button class="btn sm" data-do="focus" data-type="${x.e.type}" data-id="${x.e.id}">查看对象 →</button> ${x.id==='c2'&&mgr()?'<button class="btn sm ai" data-do="coverage-link">关联 US-006 → REQ-008（模拟）</button>':''}</div>`).join('')}`;return `<div class="notice">为缺失关联提供候选故事。应先检测可能重复的已有故事，再由项目经理审核。</div><div class="risk pad"><b>候选故事：查询跨视图风险处理证据</b><p class="muted">作为项目经理，我希望在多视图工作台定位风险关联的需求、任务与计划项，以便核实问题。</p><div class="flex"><button class="btn sm ai" data-do="planner-start">进入 AI 需求规划审核 →</button><button class="btn sm" data-do="focus" data-type="req" data-id="8">查看需求 REQ-008</button></div></div>`}
function taskDrawer(){const tab=s.dt||'执行建议';const id=s.drawerTask||2;const t=task(id);if(tab==='历史报告')return historyContent('task');if(tab==='执行建议')return `<div class="spread"><div><strong>${t?`当前关注 T-${String(t.id).padStart(3,'0')} · ${esc(t.title)}`:'项目任务建议'}</strong><p class="muted tiny">默认依据真实任务字段和关联计划证据</p></div><button class="btn sm" data-do="scan" data-report="task" ${!mgr()?'disabled':''}>手动分析</button></div>${showRisks('task')}<div class="notice">任务本体由任务管理维护。没有独立 Task 截止日期，未绑定计划项时不能计算任务逾期。</div>`;return `<div class="notice">AI 任务拆分产生的是独立候选任务，不是数据库中已存在的“父子任务”。系统当前无 Task.parentId。</div><div class="strong mb12">基于：${esc(t?.title||'实现任务分配接口')}</div>${[['实现任务接口权限校验','核对项目权限与项目成员身份'],['编写接口联调测试','验证任务负责人调整、异常入参及权限边界'],['补充任务操作记录验证','验证实际的 TaskHistory 日志可追溯']].map((x,i)=>`<div class="risk pad"><label><input class="candidate-check" type="checkbox" value="${i}" checked> <strong>${esc(x[0])}</strong></label><p class="muted tiny">${esc(x[1])}</p><span class="pill">待处理 · 可不分配负责人</span></div>`).join('')}<div class="spread"><button class="btn sm" data-do="focus" data-type="task" data-id="${id}">查看原任务</button><button class="btn sm primary" data-do="task-candidates" ${!mgr()?'disabled':''}>人工确认后创建选中任务（模拟）</button></div>`}
function scenarioContent(){const choices=[['A','方案 A · 后移接口联调 2 天，原型设计不变'],['B','方案 B · 前移测试准备 2 天，设计工期不变']];return `<div class="notice">沙盘推演不等于预测；只计算候选日期差异，不修改正式计划，不计算关键路径或精确延期概率。</div><div class="flex mb12">${choices.map(([k,v])=>`<button class="btn sm ${s.scenario===k?'primary':''}" data-do="scenario" data-id="${k}">${v}</button>`).join('')}</div>${s.scenario?`<div class="comparison"><div class="cmp"><h4>原计划</h4><div class="kv"><span>原型设计</span><b>10/19–10/29</b></div><div class="kv"><span>接口联调</span><b>10/22–10/28</b></div><div class="kv"><span>测试用例</span><b>10/25–10/30</b></div><div class="kv"><span>里程碑</span><b>10/31</b></div></div><div class="cmp"><h4>候选方案 ${s.scenario}</h4><div class="kv"><span>原型设计</span><b>10/19–10/29</b></div><div class="kv"><span>接口联调</span><b class="${s.scenario==='A'?'changed':''}">${s.scenario==='A'?'10/24–10/30':'10/22–10/28'}</b></div><div class="kv"><span>测试用例</span><b class="${s.scenario==='B'?'changed':''}">${s.scenario==='B'?'10/23–10/28':'10/25–10/30'}</b></div><div class="kv"><span>里程碑</span><b>10/31</b></div></div></div><div class="notice warn">可能的影响：请核实关联任务负责人及时间安排。当前没有任务前置依赖字段，不能声称该方案保障交付日期。</div><div class="flex"><button class="btn sm" data-do="scenario-copy">复制方案摘要</button><button class="btn sm" data-do="focus" data-type="plan" data-id="p3">定位计划项</button><button class="btn sm primary" data-do="scenario-review" ${!mgr()?'disabled':''}>进入人工修改流程 →</button></div>`:'<div class="empty">选择一个候选方案，查看同一组计划项的日期差异。</div>'}`}
function planDrawer(){const tab=s.dt||'计划风险';if(tab==='历史报告')return historyContent('plan');if(tab==='方案推演')return scenarioContent();return `<div class="spread"><strong>当前阶段：${esc(stage().title)}</strong><button class="btn sm" data-do="scan" data-report="plan" ${!mgr()?'disabled':''}>重新分析</button></div>${showRisks('plan')}<div class="notice">规则检查以 PlanStage / PlanItem 的起止日期、状态为依据。当前模型不支持前置依赖与精确关键路径。</div><button class="btn sm ai" data-do="drawer-tab" data-id="方案推演">查看调整方案推演 →</button>`}
function memberDrawer(){const tab=s.dt||'工作集中度';if(tab==='处理建议')return `<div class="notice">AI 建议需要在现有任务/计划页面由有权限的项目经理实际操作，不能直接改变负责人和日期。</div>${R.member.map(x=>`<div class="risk pad"><strong>${esc(x.title)}</strong><p class="muted">${esc(x.advice)}</p><button class="btn sm" data-do="focus" data-type="${x.e.type}" data-id="${x.e.id}">定位并人工核查 →</button></div>`).join('')}`;if(tab==='瓶颈证据')return `<h3>可核验的数据关系</h3><div class="kv"><span>成员</span><b>李四</b></div><div class="kv"><span>未完成任务</span><b>T-004、T-005、T-007</b></div><div class="kv"><span>计划窗口</span><b>p2（10/19–10/29）、p3（10/22–10/28）</b></div><div class="notice warn">时间窗口交叠 ≠ 实际工时冲突。项目中尚无估算工时和人员容量数据，禁止显示“80% 利用率”等无依据值。</div>${['task','plan'].map((k,i)=>`<button class="btn sm" data-do="focus" data-type="${k}" data-id="${i===0?5:'p3'}">定位${i===0?'任务 T-005':'计划项 p3'}</button> `).join('')}`;return `<div class="spread"><strong>任务集中度与瓶颈核查</strong><button class="btn sm" data-do="scan" data-report="member" ${!mgr()?'disabled':''}>手动分析</button></div>${showRisks('member')}<div class="notice">统计仅针对本阶段授权可见的 TaskPlanReference 关系，关联任务按 ID 去重，不把一条任务算作多个实际工作量。</div>`}

function detailDrawer(){const f=s.detail;if(!f)return '<div class="empty">未找到对象</div>';const obj=f.type==='req'?req(f.id):f.type==='story'?story(f.id):f.type==='task'?task(f.id):f.type==='plan'?plan(f.id):D.uml.find(x=>x.id===Number(f.id));if(!obj)return '<div class="notice err">该对象不存在或已不可访问。</div>';let h=`<div class="spread"><h3>${esc(obj.title)}</h3><span class="pill blue">演示数据</span></div><div class="kv"><span>对象类型</span><span>${{req:'正式需求',story:'用户故事',task:'项目任务',plan:'计划工作项',uml:'UML 用例'}[f.type]}</span></div>`;if(f.type==='req')h+=`<div class="kv"><span>描述</span>${esc(obj.desc)}</div><div class="kv"><span>关联故事</span><div>${D.stories.filter(x=>x.reqIds.includes(obj.id)).map(x=>`<button class="linkbtn" data-do="focus" data-type="story" data-id="${x.id}">US-${String(x.id).padStart(3,'0')}</button>`).join('')||'暂无'}</div></div>`;if(f.type==='story')h+=`<div class="kv"><span>描述</span>${esc(obj.desc)}</div><div class="kv"><span>验收条件</span>${esc(obj.ac)}</div><div class="kv"><span>关联需求</span>${obj.reqIds.map(i=>`<button class="linkbtn" data-do="focus" data-type="req" data-id="${i}">REQ-${String(i).padStart(3,'0')}</button>`).join('')||'暂无'}</div>`;if(f.type==='task')h+=`<div class="kv"><span>负责人</span>${esc(obj.assignee||'未指派')}</div><div class="kv"><span>优先级</span>${esc(obj.priority)}</div><div class="kv"><span>状态/进度</span>${stName(obj.status)} · ${obj.progress}%</div><div class="kv"><span>计划关联</span>${obj.plan.map(i=>`<button class="linkbtn" data-do="focus" data-type="plan" data-id="${i}">${esc(plan(i)?.title||i)}</button>`).join('')||'暂无'}</div>`;if(f.type==='plan')h+=`<div class="kv"><span>负责人</span>${obj.owner}</div><div class="kv"><span>预计日期</span>${obj.start} — ${obj.end}</div><div class="kv"><span>状态</span>${stName(obj.status||'TODO')}</div><div class="kv"><span>关联任务</span>${obj.tasks.map(i=>`<button class="linkbtn" data-do="focus" data-type="task" data-id="${i}">T-${String(i).padStart(3,'0')}</button>`).join('')||'暂无'}</div>`;return h+`<div class="notice">点击关联对象可跨页面切换并定位高亮；正式业务修改需在仓库原页面中执行。</div>${f.type==='req'&&mgr()?'<button class="btn ai" data-do="planner-existing" data-id="'+obj.id+'">✦ AI 分析已有需求</button>':''}${f.type==='task'&&mgr()?'<button class="btn ai" data-do="task-ai" data-id="'+obj.id+'">✦ AI 执行建议</button>':''}`}
function drawer(){if(!s.drawer)return;const n=s.drawer;let tabs=n==='detail'?[]:tabsFor(n);const target=tabs.includes(s.dt)?s.dt:(tabs[0]||'');s.dt=target;$('drawerTitle').textContent=n==='detail'?'业务对象详情':rtitles[n];$('drawerSubtitle').textContent='当前项目 · 手动分析 · 仅用于交互原型审核';$('drawerTabs').innerHTML=tabs.map(x=>`<button class="tab ${x===target?'active':''}" data-do="drawer-tab" data-id="${x}">${x}</button>`).join('');$('drawerBody').innerHTML=({health:healthDrawer,coverage:coverageDrawer,task:taskDrawer,plan:planDrawer,member:memberDrawer,workbench:workbenchDrawer,detail:detailDrawer}[n]||(()=>'<div>—</div>'))();$('drawerFooter').innerHTML=`${n!=='detail'?'<button class="btn sm" data-do="scan" data-report="'+n+'" '+(!mgr()?'disabled':'')+'>⟳ 手动重新分析</button>':''}<button class="btn sm" data-do="close-drawer">关闭</button>`;}
function renderDemo(){const routes=[['① 项目概览 · 健康诊断','overview',''],['② 需求管理 · 智能规划','requirements','list'],['③ 故事地图 · AI 覆盖','requirements','map'],['④ 任务管理 · AI 建议','tasks',''],['⑤ 甘特图 · AI 推演','plan','gantt'],['⑥ 成员任务跟踪 · AI 负载','plan','members'],['⑦ 多视图工作台 · AI 关联','workbench','']];$('demoPanel').classList.toggle('open',s.demo);$('demoPanel').innerHTML=`<div class="spread"><strong>七页交互验收</strong><span class="pill blue">离线原型</span></div><p class="tiny muted">快速定位七个 AI 设计区，不增加原系统业务导航</p>${routes.map(([name,p,sub])=>`<button class="btn sm" data-do="demo-go" data-page="${p}" data-sub="${sub}">${name}</button>`).join('')}<div class="divider"></div><label class="formlabel">模拟权限</label><select id="demoRole" class="field"><option value="manager" ${mgr()?'selected':''}>项目经理（可发起 AI）</option><option value="member" ${!mgr()?'selected':''}>普通成员（有限查看）</option></select><label class="formlabel">健康诊断返回模式</label><select id="healthMode" class="field"><option value="normal">发现风险</option><option value="clear" ${s.healthMode==='clear'?'selected':''}>没有发现风险</option><option value="partial" ${s.healthMode==='partial'?'selected':''}>部分成功</option></select><label class="tiny mt8" style="display:block"><input type="checkbox" id="simulateFail" ${s.simulateFail?'checked':''}> 模拟 AI 服务失败</label><div class="flex mt12"><button class="btn sm" data-do="report-stale">把健康报告标记过期</button><button class="btn sm danger" data-do="demo-reset">重置演示</button></div>`}

function locate(type,id){id=type==='plan'?String(id):Number(id);if(type==='req'&&!req(id)||type==='story'&&!story(id)||type==='task'&&!task(id)||type==='plan'&&!plan(id)||type==='uml'&&!D.uml.some(x=>x.id===id)){return showtoast('该对象不存在或当前无权访问')}if(!mgr()&&type==='task'&&task(id)?.assignee!=='王五')return showtoast('无权访问其他成员任务');s.highlight={type,id};closeDrawer();if(s.page==='workbench'&&type!=='req'){s.focus={type,id};if(type==='plan')s.wb='gantt';if(type==='story')s.wb='map';if(type==='task')s.wb='members';if(type==='uml')s.wb='uml';s.dual=true;if(s.wbOther===s.wb)s.wbOther=s.wb==='map'?'uml':'map';app();showtoast('已设置跨视图关联焦点并高亮相关对象');return}if(type==='req'){s.page='requirements';s.tab='list';s.reqExpand={1:true,4:true,7:true};}if(type==='story'){s.page='requirements';s.tab='map';s.goal=D.epics.find(e=>e.id===story(id).epicId)?.goalId||1;}if(type==='task'){s.page='tasks';s.taskTab='list';s.taskStatus='all';s.taskMember='all';s.taskPriority='all';s.taskQuery='';}if(type==='plan'){s.page='plan';s.planTab='gantt';s.stage=plan(id).stageId;}if(type==='uml'){s.page='workbench';s.wb='uml';s.focus={type,id}}app();showtoast('已定位并高亮业务对象');setTimeout(()=>{document.querySelector('.isfocus')?.scrollIntoView({block:'center',behavior:'smooth'});},100)}
function openDetail(type,id){s.detail={type,id:type==='plan'?id:Number(id)};openDrawer('detail')}
function plannerValidation(){const p=s.planner,it=p.items;const active=x=>x&&x.status!=='skip';const issues=[];if(!it.some(active))issues.push('至少保留一项候选对象');for(const i of it.filter(active)){if(!i.reviewed)issues.push('仍有未审核内容');if(!i.title.trim())issues.push('标题不能为空');if(i.kind==='req'&&i.parent){let cur=i,seen=new Set([i.id]),depth=1;while(cur.parent){cur=it.find(x=>x.id===cur.parent);if(!cur||!active(cur)){issues.push('需求父节点被跳过或不存在');break}if(seen.has(cur.id)){issues.push('需求层级出现循环');break}seen.add(cur.id);depth++;if(depth>3){issues.push('AI 需求建议超过三层');break}}}if(i.kind==='story'){const e=it.find(x=>x.id===i.epicRef);const r=it.find(x=>x.id===i.reqRef);if(!active(e)||!active(r))issues.push('用户故事的 Epic 或需求关联已被跳过')}if(i.kind==='task'&&!active(it.find(x=>x.id===i.storyRef)))issues.push('实施任务关联的用户故事已被跳过');if(i.status==='reuse'&&!i.matchId)issues.push('所复用的对象不存在')}return [...new Set(issues)]}
function plannerGenerate(){if(!mgr())return showtoast('无权发起');const p=s.planner;if(!p.input.trim())return showtoast('请先输入需求描述或使用示例');if(s.simulateFail){p.step='failed';app();return}p.step='loading';app();setTimeout(()=>{p.items=plannerNewItems();p.step='review';p.selected='r0';p.dirty=true;app();showtoast('已生成候选规划，请逐项审核')},700)}
function plannerDraft(){const p=s.planner;if(!mgr())return showtoast('普通成员不能保存草稿');const id=p.draftId||String(Date.now());const dat={id,at:new Date().toLocaleString('zh-CN'),title:p.input.slice(0,32)||'需求规划草稿',planner:cp(p)};s.drafts=s.drafts.filter(x=>x.id!==id);s.drafts.push(dat);p.draftId=id;p.dirty=false;persist();app();showtoast('草稿已保存在本浏览器；未进入正式业务数据')}
function showDrafts(){modal('我的 AI 需求规划草稿',`<div class="notice">演示草稿持久化到浏览器本地存储，非真实 SPM 后端。</div>${s.drafts.length?s.drafts.slice().reverse().map(d=>`<div class="draftrow"><div><b>${esc(d.title)}</b><div class="muted tiny">${esc(d.at)}</div></div><button class="btn sm" data-do="planner-recover" data-id="${esc(d.id)}">继续审核</button></div>`).join(''):'<div class="empty">暂无已保存草稿</div>'}`)}
function plannerLeave(force=false){if(s.planner.dirty&&!force){modal('有尚未保存的修改',`<p>离开将丢失当前未保存的审核修改。已保存草稿不受影响。</p>`,`<button class="btn" data-do="modal-close">继续审核</button><button class="btn danger" data-do="planner-leave-force">放弃未保存修改并离开</button>`);return}modalClose();s.page='requirements';s.tab='list';app()}
function plannerCommit(){const problems=plannerValidation();if(problems.length){s.planner.step='confirm';app();showtoast('仍有待修复的校验问题');return}if(s.simulateFail){modal('模拟事务失败',`<div class="notice err">模拟事务写入失败：本次全部回滚，无部分创建结果；审核草稿和人工修改仍保留。</div>`,`<button class="btn primary" data-do="modal-close">返回修改并重试</button>`);return}const it=s.planner.items,all=it.filter(x=>x.status!=='skip'),ids={};const groups=['req','epic','story','task'];for(const kind of groups){for(const x of all.filter(n=>n.kind===kind)){if(x.status==='reuse'){ids[x.id]=x.matchId;continue}if(kind==='req'){const id=Math.max(...D.requirements.map(z=>z.id))+1;D.requirements.push({id,title:x.title,parent:x.parent?(ids[x.parent]||null):null,desc:x.description,updated:'2026-10-23'});ids[x.id]=id;}if(kind==='epic'){let id=Math.max(...D.epics.map(z=>z.id))+1;D.epics.push({id,title:x.title,goalId:s.goal});D.goals.find(z=>z.id===s.goal)?.epicIds.push(id);ids[x.id]=id;}if(kind==='story'){let id=Math.max(...D.stories.map(z=>z.id))+1;D.stories.push({id,epicId:ids[x.epicRef]||2,title:x.title,desc:x.description,ac:x.ac||'',status:'TODO',reqIds:[ids[x.reqRef]].filter(Boolean),taskIds:[]});ids[x.id]=id;}if(kind==='task'){const id=Math.max(...D.tasks.map(z=>z.id))+1;D.tasks.push({id,title:x.title,assignee:null,priority:'MEDIUM',status:'TODO',progress:0,storyIds:[ids[x.storyRef]].filter(Boolean),plan:[]});for(const sid of [ids[x.storyRef]].filter(Boolean)){let st=story(sid);if(st&&!st.taskIds.includes(id))st.taskIds.push(id)}ids[x.id]=id}}}
for(const x of all.filter(x=>x.kind==='story'&&x.status==='reuse')){const st=story(ids[x.id]);const rid=ids[x.reqRef];if(st&&rid&&!st.reqIds.includes(rid))st.reqIds.push(rid)}s.planner.step='success';s.planner.dirty=false;s.drafts=s.drafts.filter(x=>x.id!==s.planner.draftId);persist();app();showtoast('已完成原型内存数据的模拟提交（非真实数据库）')}
function navTo(p){if(s.page==='planning'&&s.planner.dirty){plannerLeave();return}if(['docs','members','projects'].includes(p)){modal('原系统业务页面',`<div class="notice">本 HTML 只集成七项 AI 化页面。${p==='docs'?'项目文档':p==='members'?'成员与角色':'我的项目'}在真实 SPM 仓库中继续使用原业务组件，此处不重画或冒充完整业务实现。</div>`);return}s.page=p;s.highlight=null;if(p==='requirements')s.tab='list';if(p==='plan')s.planTab='gantt';app()}
function click(e){const b=e.target.closest('[data-page],[data-do],[data-action]');if(!b)return;if(b.dataset.page&&!b.dataset.do){navTo(b.dataset.page);return}const op=b.dataset.do||b.dataset.action;const id=b.dataset.id;const name=b.dataset.name;switch(op){case 'demo':s.demo=!s.demo;renderDemo();break;case 'demo-go':if(s.page==='planning'&&s.planner.dirty){plannerLeave();break}s.page=b.dataset.page;if(s.page==='requirements')s.tab=b.dataset.sub||'list';if(s.page==='plan')s.planTab=b.dataset.sub||'gantt';app();break;case 'project':showtoast('当前原型只提供“爱管理开发项目”的单项目演示');break;case 'logout':modal('退出登录（原型）','<p>仅模拟退出登录，真实认证仍由 SPM 原系统负责。</p>');break;case 'collapse':showtoast('原仓库支持侧栏折叠；七页原型以 224px 展开状态审核');break;case 'project-info':modal('项目基本信息',`<div class="kv"><span>项目名称</span>爱管理开发项目</div><div class="kv"><span>项目编号</span>P-001</div><div class="kv"><span>项目经理</span>项目经理</div>`);break;case 'close-drawer':closeDrawer();break;case 'modal-close':modalClose();break;
case 'drawer':openDrawer(name);break;case 'open-health':openDrawer('health',{tab:b.dataset.dim});break;case 'drawer-tab':s.dt=id;s.riskOpen='';drawer();break;case 'scan':{const w=b.dataset.report;manualScan(w);break}case 'risk-open':s.riskOpen=s.riskOpen===id?'':id;drawer();break;case 'history':{const ar=s.ai[name]?.history||[];s.historyId=ar[Number(b.dataset.index)]||null;showtoast('历史报告为只读演示记录');drawer();break}case 'history-latest':s.historyId=null;drawer();break;case 'report-stale':if(!s.ai.health)return showtoast('请先生成健康诊断报告');s.ai.health.status='stale';persist();app();break;case 'demo-reset':{if(!confirm('重置 AI 报告、草稿和当前演示操作？'))break;localStorage.removeItem(storage);location.reload();break}
case 'focus':{const type=b.dataset.type;const vid=type==='plan'?id:Number(id);locate(type,vid);break}case 'clear-focus':s.focus=null;app();break;case 'req-tab':s.tab=id;app();break;case 'toggle-req':s.reqExpand[id]=!s.reqExpand[id];app();break;case 'req-expand':s.reqExpand=Object.fromEntries(D.requirements.map(x=>[x.id,b.dataset.mode==='all']));app();break;case 'refresh':app();showtoast('已刷新原型视图');break;case 'req-op':if(b.dataset.op==='0')openDetail('req',id);else if(!mgr())showtoast('仅项目经理可以编辑');else if(b.dataset.op==='1')modal('编辑需求（业务原型）',`<div class="notice">仓库原有编辑弹窗仍保留。AI 新增功能不替换此弹窗。</div><div class="kv"><span>需求</span>${esc(req(Number(id))?.title)}</div>`);else modal('新建子需求（业务原型）',`<p>上级需求：REQ-${id}。原有父子层级业务入口保留。</p>`);break;case 'req-create':modal('新建需求（原有功能）',`<p>真实开发中继续调用原仓库需求创建弹窗。本原型集中审核 AI 功能。</p>`);break;case 'story-create':modal('编辑故事地图对象（原有功能）','<p>保留原仓库的产品目标、Epic、用户故事新建及编辑流程；AI 只在旁侧增加建议入口。</p>');break;case 'goal':s.goal=Number(id);app();break;case 'coverage-link':if(!mgr())return showtoast('无权限建立关联');if(story(6).reqIds.includes(8))return showtoast('此关联已存在');modal('人工确认关联（模拟）',`<p>是否将 <b>US-006</b> 关联至 <b>REQ-008</b>？</p><div class="notice">这只修改原型内存，不会修改真实数据库。</div>`,`<button class="btn" data-do="modal-close">取消</button><button class="btn primary" data-do="coverage-link-confirm">确认关联</button>`);break;case 'coverage-link-confirm':story(6).reqIds.push(8);modalClose();if(s.ai.coverage)s.ai.coverage.status='stale';persist();app();showtoast('关联已在演示数据中更新');break;
case 'task-tab':s.taskTab=id;app();break;case 'task-ai':s.drawerTask=Number(id);openDrawer('task',{tab:'执行建议',task:Number(id)});break;case 'task-create':modal('新建任务（原有功能）','<p>正式业务任务创建使用原仓库弹窗；AI 候选任务请在「AI 任务建议 → 任务拆分」审核。</p>');break;case 'task-edit':modal('编辑任务（原有功能）',`<p>任务 T-${id}：${esc(task(Number(id))?.title)}。正式任务编辑沿用原仓库组件。</p>`);break;case 'task-archive':modal('任务归档管理','<p>原有归档菜单保持不变。此原型不模拟归档持久化。</p>');break;case 'task-candidates':{const chosen=[...document.querySelectorAll('.candidate-check:checked')].map(el=>Number(el.value));if(!chosen.length)return showtoast('请先勾选候选任务');const titles=['实现任务接口权限校验','编写接口联调测试','补充任务操作记录验证'];modal('确认创建候选任务',`<p>将创建 ${chosen.length} 条独立的待处理任务，负责人留空，不自动添加计划日期。</p>${chosen.map(i=>`<div class="rowlist">${titles[i]}</div>`).join('')}`,`<button class="btn" data-do="modal-close">取消</button><button class="btn primary" data-do="task-candidates-confirm" data-ids="${chosen.join(',')}">确认创建（模拟）</button>`);break}case 'task-candidates-confirm':{if(!mgr())return showtoast('无任务创建权限');const titles=['实现任务接口权限校验','编写接口联调测试','补充任务操作记录验证'];for(const n of b.dataset.ids.split(',').map(Number)){const id=Math.max(...D.tasks.map(x=>x.id))+1;D.tasks.push({id,title:titles[n],assignee:null,priority:'MEDIUM',status:'TODO',progress:0,storyIds:[3],plan:[]});story(3).taskIds.push(id)}modalClose();closeDrawer();s.page='tasks';app();showtoast('已添加到演示任务表；真实数据库未修改');break}
case 'stage':s.stage=id;app();break;case 'plan-tab':s.planTab=id;app();break;case 'plan-create':modal('项目计划原有操作','<p>创建、编辑、移动计划项与里程碑通过原仓库 PlanView/PlanGantt 执行；AI 方案推演只展示候选变化。</p>');break;case 'gantt-today':showtoast('已定位到演示日期所在周');break;case 'gantt-scale':showtoast('演示按周显示；原仓库保留日/周/月切换');break;case 'member-expand':{const names=['项目经理','开发人员','测试人员','李四','张三','王五','未指派'];for(const n of names)s.groups[n]=id==='all';app();break}case 'member-toggle':s.groups[id]=s.groups[id]===false;app();break;
case 'wb-primary':s.wb=id;if(s.wbOther===id)s.wbOther=id==='map'?'uml':'map';app();break;case 'wb-dual':s.dual=id==='yes';app();break;case 'wb-preset':s.wb=b.dataset.a;s.wbOther=b.dataset.b;s.dual=true;app();break;case 'scenario':s.scenario=id;drawer();break;case 'scenario-review':modal('方案推演：人工处理边界','<p>候选调整必须由项目经理在「项目计划」编辑器中确认日期，并经过原有权限与版本校验。</p><div class="notice warn">当前原型不会直接更新甘特图。</div>',`<button class="btn" data-do="modal-close">关闭</button><button class="btn primary" data-do="scenario-locate">定位需编辑计划项</button>`);break;case 'scenario-locate':modalClose();locate('plan','p3');break;case 'scenario-copy':{const msg=s.scenario==='A'?'方案A：将接口联调日期调整为 10/24–10/30，需人工核实':'方案B：将测试准备调整为 10/23–10/28，需人工核实';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>showtoast('已复制候选方案摘要')).catch(()=>showtoast(msg));else showtoast(msg);break}
case 'planner-start':closeDrawer();plannerStart();break;case 'planner-existing':closeDrawer();plannerStart('existing',Number(id));break;case 'planner-sample':s.planner.input='希望项目经理能够创建项目任务、分配负责人，开发和测试成员可以查看自己的任务；需遵守项目角色权限。';app();break;case 'planner-generate':plannerGenerate();break;case 'planner-retry':s.planner.step='input';app();break;case 'planner-select':s.planner.selected=id;app();break;case 'planner-review':{const n=s.planner.items.find(x=>x.id===id);if(n){n.reviewed=true;s.planner.dirty=true}app();break}case 'planner-confirm':s.planner.step='confirm';app();break;case 'planner-step-review':s.planner.step='review';app();break;case 'planner-save':plannerDraft();break;case 'planner-drafts':showDrafts();break;case 'planner-recover':{const d=s.drafts.find(x=>x.id===id);if(!d)return showtoast('草稿已不存在');s.planner=cp(d.planner);s.planner.draftId=d.id;s.planner.dirty=false;modalClose();s.page='planning';app();showtoast('已恢复审核内容，请核对已有业务对象有效性');break}case 'planner-back':plannerLeave();break;case 'planner-leave-force':s.planner.dirty=false;plannerLeave(true);break;case 'planner-commit':plannerCommit();break;case 'show-story-map':s.page='requirements';s.tab='map';app();break;
case 'risk-history':s.dt='历史报告';drawer();break;default:showtoast('演示功能：'+op);}}
function change(e){const t=e.target;const v=t.value;if(t.id==='demoRole'){s.role=v;closeDrawer();app();showtoast(v==='member'?'已切换普通成员受限视角':'已切换项目经理视角');return}if(t.id==='healthMode'){s.healthMode=v;renderDemo();return}if(t.id==='simulateFail'){s.simulateFail=t.checked;renderDemo();return}if(t.id==='riskLevel'){s.riskLevel=v;drawer();return}if(t.id==='reqSearch'){s.reqQuery=v;app();document.querySelector('#reqSearch')?.focus();return}if(t.id==='reqRelation'){s.reqRelation=v;app();return}if(t.id==='taskSearch'){s.taskQuery=v;app();document.querySelector('#taskSearch')?.focus();return}if(t.id==='taskStatus'){s.taskStatus=v;app();return}if(t.id==='taskPriority'){s.taskPriority=v;app();return}if(t.id==='taskMember'){s.taskMember=v;app();return}if(t.id==='memberOnly'){s.onlyLinked=t.checked;app();return}if(t.id==='wbSecond'){s.wbOther=v;app();return}if(t.id==='focusStory'){if(v){s.focus={type:'story',id:Number(v)};s.highlight={type:'story',id:Number(v)}}else s.focus=null;app();return}if(['plannerInput','plannerNotes','plannerTitle','plannerDesc','plannerAc','plannerParent','plannerAction'].includes(t.id)){const p=s.planner;p.dirty=true;if(t.id==='plannerInput'){p.input=v;return}if(t.id==='plannerNotes'){p.notes=v;return}const n=p.items.find(x=>x.id===p.selected);if(!n)return;const key={plannerTitle:'title',plannerDesc:'description',plannerAc:'ac',plannerParent:'parent',plannerAction:'status'}[t.id];n[key]=v;t.id==='plannerParent'&&v===''&&(n.parent=null);n.reviewed=false;if(t.id==='plannerParent'||t.id==='plannerAction')app();return}}
function input(e){const t=e.target;if(t.id==='plannerInput'){s.planner.input=t.value;s.planner.dirty=true}if(t.id==='plannerNotes'){s.planner.notes=t.value;s.planner.dirty=true}if(['plannerTitle','plannerDesc','plannerAc'].includes(t.id)){const n=s.planner.items.find(x=>x.id===s.planner.selected);if(n){n[{plannerTitle:'title',plannerDesc:'description',plannerAc:'ac'}[t.id]]=t.value;n.reviewed=false;s.planner.dirty=true}}}
document.addEventListener('click',click);document.addEventListener('change',change);document.addEventListener('input',input);window.addEventListener('keydown',e=>{if(e.key==='Escape'){modalClose();closeDrawer();s.demo=false;renderDemo()}});app();
})();
</script></body></html>
